name: Excavator

on:
  schedule:
    # 每天 UTC 0点（北京时间早8点）运行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在 GitHub 页面上随时点击“Run workflow”手动测试

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    permissions:
      contents: write # 必须赋予写入权限，机器人才能自动 commit 并 push 更新后的清单
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Excavate
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
