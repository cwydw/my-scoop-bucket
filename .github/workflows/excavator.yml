name: Auto Update Manifests

on:
  schedule:
    # 每天 UTC 0 点（北京时间早 8 点）自动检查更新一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 也支持在 GitHub 网页上点击按钮手动立即触发

jobs:
  excavator:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Scoop Excavator
        uses: ScoopInstaller/Excavator@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # 发生更新时自动提交的 Commit 格式
          commit-message: 'chore(auto): update manifests'